# wuji_ros analysis environment: bag extraction, HaMeR 2D, MANO fitting, evaluation.
# The glove bridge does not use this env; it runs on the recording PC's ROS2 Humble python3.10.
# chumpy is installed in a second step (README), because its setup.py imports pip internals.
name: wuji_ros
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools=80.9.0  # pytorch-lightning 2.0.x imports pkg_resources, which newer setuptools no longer ships
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.0.1+cu118
      - torchvision==0.15.2+cu118
      - numpy==1.23.5  # chumpy, needed to unpickle the MANO .pkl, breaks on numpy >= 1.24
      - scipy==1.13.1
      - opencv-python==4.11.0.86
      - smplx==0.1.28
      - pytorch-lightning==2.0.9
      - timm==1.0.25
      - einops==0.8.2
      - yacs==0.1.8
      - pyrender==0.1.45
      - trimesh==3.23.5
      - rosbags==0.11.3
      - matplotlib==3.9.4
